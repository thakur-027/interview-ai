server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing. Without this, refreshing on
    # a route like /dashboard would 404 at nginx because no such file
    # exists on disk - this falls back to index.html and lets React
    # Router handle the path instead.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
